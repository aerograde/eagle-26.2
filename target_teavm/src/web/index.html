		<script type="text/javascript">
			// Resume suspended audio contexts after user input.
			(function() {
				var Real = window.AudioContext || window.webkitAudioContext;
				if(!Real) return;
				var live = [];
				function Wrapped() {
					var c = arguments.length ? new Real(arguments[0]) : new Real();
					live.push(c);
					return c;
				}
				Wrapped.prototype = Real.prototype;
				window.AudioContext = Wrapped;
				if(window.webkitAudioContext) window.webkitAudioContext = Wrapped;
				function resumeAll() {
					for(var i = 0; i < live.length; ++i) {
						try { if(live[i].state === "suspended") live[i].resume(); } catch(e) {}
					}
				}
				window.addEventListener("mousedown", resumeAll, true);
				window.addEventListener("keydown", resumeAll, true);
				window.addEventListener("touchstart", resumeAll, true);
			})();
		</script>
		<!-- Explicit worker script URL; the deploy script stamps its version. -->

		<script type="text/javascript">
			"use strict";
			// Keep the early-load layer visible while synchronous startup blocks painting.
			(function() {
				function opts() {
					return {
						container: "game_frame",
						inputSelfTest: false,
						webgl2SelfTest: false,
						// Transfer and codec self-test.
						meshWorkerSelfTest: window.location.search.indexOf("meshtest") >= 0,
						// Inline-versus-worker compile self-test.
						meshWorkerCompileTest: window.location.search.indexOf("meshtest2") >= 0,
						// ?nomesh disables workers; ?meshworkerverify enables sampled verification.
						meshWorkers: window.location.search.indexOf("nomesh") < 0,
						meshWorkerVerify: window.location.search.indexOf("meshworkerverify") >= 0,
						titleProbe: window.location.search.indexOf("autostart") >= 0,
						assetsURI: [
							{ url: "assets.epk?v=c44", path: "" },
							{ url: "sounds.epk?v=c44", path: "" },
								{ url: "music.epk?v=c48", path: "" }
						],
						localesURI: "lang/",
						worldsDB: "worlds",
						resourcePacksDB: "resourcePacks",
						crashOnUncaughtExceptions: true,
						enableEPKVersionCheck: false,
						allowBootMenu: false,
						// Fallback path when the server worker is unavailable.
						singleThreadMode: true,
						// ?singlethread disables the integrated-server worker.
						serverWorker: window.location.search.indexOf("singlethread") < 0
					};
				}

				function unlockAudio() {
					try {
						var Ctx = window.AudioContext || window.webkitAudioContext;
						if(Ctx) {
							var ctx = new Ctx();
							if(ctx.state === "suspended" && ctx.resume) { ctx.resume(); }
							var s = ctx.createBufferSource();
							s.buffer = ctx.createBuffer(1, 1, 22050);
							s.connect(ctx.destination); s.start(0);
							window.__eaglerAudioContext = ctx;
						}
					} catch(e) {}
				}

				// Java updates the early boot status and progress bar.
				window.__eaglerBoot = function(pct, text) {
					try {
						var st = document.getElementById("boot_status");
						if(st && text) { st.textContent = text; }
						var bar = document.getElementById("boot_progress_bar");
						if(bar && typeof pct === "number") { bar.style.width = Math.max(0, Math.min(100, pct)) + "%"; }
						var wrap = document.getElementById("boot_progress");
						if(wrap) { wrap.style.visibility = "visible"; }
					} catch(e) {}
				};

				var launched = false;
				function startGame() {
					if(launched) { return; }
					launched = true;
					window.eaglercraftXOpts = opts();
					main([]);
					var load = document.getElementById("loading_screen");
					var t0 = Date.now();
					function dismiss() {
						if(load && load.parentNode) { load.parentNode.removeChild(load); }
						document.body.style.backgroundColor = "black";
					}
					var eagtekGone = false;
						(function poll() {
							var crashed = document.querySelector("._eaglercraftX_crash_element");
							if(crashed !== null || Date.now() - t0 > 300000) { dismiss(); return; }
							// Reveal the canvas after its first frame.
							if(!eagtekGone && window.__eaglerGameReady === true) {
								eagtekGone = true;
								if(window.location.search.indexOf("autostart") >= 0) { dismiss(); return; } // headless: no gate
								if(load) { load.style.display = "none"; } // reveal the vanilla loading screen
							}
							// Show the sound gate when the menu is ready.
							if(eagtekGone && window.__eaglerMenuReady === true) {
								if(load) {
									load.style.display = "flex";
									load.style.backgroundColor = "black";
									var img = document.getElementById("boot_image");
									if(img) { img.style.display = "none"; }
									var bar = document.getElementById("boot_progress");
									if(bar) { bar.style.display = "none"; }
									var st = document.getElementById("boot_status");
									if(st) { st.style.cssText = "position:static;color:#f0f0f0;font-family:'Trebuchet MS','Segoe UI',sans-serif;font-weight:bold;font-size:clamp(22px,4.5vw,44px);line-height:1.35;text-shadow:2px 2px 0 rgba(0,0,0,0.55);"; st.innerHTML = "press any key to enable sound\u2026<div style='margin-top:0.6em;font-size:0.5em;font-weight:normal;color:#9a9a9a;'>(required)</div>"; }
								}
								function go() {
									window.removeEventListener("mousedown", go, true);
									window.removeEventListener("keydown", go, true);
									window.removeEventListener("touchstart", go, true);
									window.__eaglerGesture = true;
									unlockAudio();
									dismiss();
								}
								window.addEventListener("mousedown", go, true);
								window.addEventListener("keydown", go, true);
								window.addEventListener("touchstart", go, true);
								return;
							}
							setTimeout(poll, 150);
						})();
				}

				function beginLoad() {
					var cd = document.getElementById("launch_countdown_screen");
					if(cd && cd.parentNode) { cd.parentNode.removeChild(cd); }
					// Let the early-load layer paint before synchronous startup.
					setTimeout(startGame, 100);
				}

				window.addEventListener("load", function() {
					if(window.location.href.indexOf("file:") === 0) {
						alert("HTTP please, do not open this file locally, run a local HTTP server and load it via HTTP");
						return;
					}

					// Unlock audio on the first user gesture.
					function gestureUnlock() {
						if(!window.__eaglerGesture) { window.__eaglerGesture = true; unlockAudio(); }
					}
					window.addEventListener("mousedown", gestureUnlock, true);
					window.addEventListener("keydown", gestureUnlock, true);
					window.addEventListener("touchstart", gestureUnlock, true);

					// Headless probes skip the countdown.
					if(window.location.search.indexOf("autostart") >= 0) {
						beginLoad();
						return;
					}

					// Legacy launch countdown.
					var launchInterval = -1;
					var launchCounter = 1;
					var launchSkipCountdown = false;
					var numEl = document.getElementById("launchCountdownNumber");
					var barEl = document.getElementById("launchCountdownProgress");
					function launchTick() {
						numEl.innerText = "" + Math.floor(6.0 - launchCounter * 0.06);
						barEl.style.width = "" + launchCounter + "%";
						if(++launchCounter > 100 || launchSkipCountdown) {
							clearInterval(launchInterval);
							setTimeout(beginLoad, 50);
						}
					}
					launchInterval = setInterval(launchTick, 50);
					document.getElementById("skipCountdown").addEventListener("click", function() {
						launchSkipCountdown = true;
					});
				});
			})();
		</script>
