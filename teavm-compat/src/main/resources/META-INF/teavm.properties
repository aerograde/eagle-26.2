# Eagler 26.2 Phase 3.0 — TeaVM 0.13 classlib-compat mappings.
#
# Mirrors the convention teavm-classlib itself uses (see teavm-classlib.jar's
# META-INF/teavm.properties): a class named
#   net.lax1dude.eaglercraft.v1_8.teavmcompat.java.util.THexFormat
# materializes as java.util.HexFormat. TeaVM's RenamingResourceMapper collects
# mapPackageHierarchy rules from ALL jars into a list and picks the first
# candidate class that actually exists, so this hierarchy coexists with
# teavm-classlib as long as we never duplicate a class the classlib already
# provides (for those, methods are injected by the JdkMethodInjector plugin).
#
# mapClass rules are consulted BEFORE package-hierarchy rules, which makes them
# deterministic whole-class replacements even when the classlib has the class.

mapPackageHierarchy|net.lax1dude.eaglercraft.v1_8.teavmcompat.java=java
stripPrefixFromPackageHierarchyClasses|net.lax1dude.eaglercraft.v1_8.teavmcompat.java=T
mapPackageHierarchy|net.lax1dude.eaglercraft.v1_8.teavmcompat.javax=javax
stripPrefixFromPackageHierarchyClasses|net.lax1dude.eaglercraft.v1_8.teavmcompat.javax=T
mapPackageHierarchy|net.lax1dude.eaglercraft.v1_8.teavmcompat.jdk=jdk
stripPrefixFromPackageHierarchyClasses|net.lax1dude.eaglercraft.v1_8.teavmcompat.jdk=T
mapPackageHierarchy|net.lax1dude.eaglercraft.v1_8.teavmcompat.sun=sun
stripPrefixFromPackageHierarchyClasses|net.lax1dude.eaglercraft.v1_8.teavmcompat.sun=T

# java.util.UUID in teavm-classlib 0.13 is string-backed (no mostSigBits /
# leastSigBits), which cannot support UUID(long,long) & friends that MC 26.2
# uses everywhere. Replace the whole class with a faithful bit-based port.
mapClass|net.lax1dude.eaglercraft.v1_8.teavmcompat.replace.TUUID=java.util.UUID
mapClass|net.lax1dude.eaglercraft.v1_8.teavmcompat.replace.TStandardSocketOptions=java.net.StandardSocketOptions
