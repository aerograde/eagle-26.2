# Ordinary javac tasks peak around 1.4-2.3 GiB in this workspace. Expensive
# TeaVM links override this explicitly in the build scripts below; keeping a
# 12 GiB default made every one-off Gradle daemon reserve release-build memory.
org.gradle.jvmargs=-Xmx4096m -Xss8m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.workers.max=1
